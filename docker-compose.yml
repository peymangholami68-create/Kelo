services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kelo
      POSTGRES_USER: kelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      # فقط داده؛ migrationها را initdb اجرا نکند (با migrate.js تداخل می‌سازد)
      - kelo_v061_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelo -d kelo"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://kelo:${POSTGRES_PASSWORD:-change-me}@db:5432/kelo
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-replace-this-secret}
      NATIONAL_ID_ENCRYPTION_KEY: ${NATIONAL_ID_ENCRYPTION_KEY:-replace-this-64-hex-secret}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # بیرون: http://localhost:3001  | داخل کانتینر: :3000
      - "127.0.0.1:3001:3000"

volumes:
  kelo_v061_pgdata:
