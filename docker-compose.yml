services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kelo}
      POSTGRES_USER: ${POSTGRES_USER:-kelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - kelo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kelo} -d ${POSTGRES_DB:-kelo}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kelo

  migrate:
    build: .
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kelo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kelo}
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    networks:
      - kelo

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kelo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kelo}
      PORT: 3000
      NODE_ENV: production
      TRUST_PROXY: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - kelo

volumes:
  kelo_pgdata:

networks:
  kelo:
    driver: bridge
