services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kelo
      POSTGRES_USER: kelo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kelo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelo_user -d kelo"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kelo_user:${POSTGRES_PASSWORD}@db:5432/kelo
      PORT: 3000
      NODE_ENV: production
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

volumes:
  kelo_postgres_data:
